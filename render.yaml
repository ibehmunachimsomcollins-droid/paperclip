# NEXUS self-hosted deployment on Render.
# Uses the upstream Docker production image target; agent functionality stays in Paperclip.
services:
  - type: web
    name: nexus-paperclip-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: nexus-paperclip-home
      mountPath: /paperclip
      sizeGB: 10
    envVars:
      - key: PORT
        value: "3100"
      - key: SERVE_UI
        value: "true"
      - key: PAPERCLIP_BIND
        value: lan
      - key: PAPERCLIP_DEPLOYMENT_MODE
        value: authenticated
      - key: PAPERCLIP_DEPLOYMENT_EXPOSURE
        value: public
      - key: PAPERCLIP_AUTH_BASE_URL_MODE
        value: explicit
      - key: PAPERCLIP_PUBLIC_URL
        value: https://nexus-paperclip-web.onrender.com
      - key: PAPERCLIP_AUTH_PUBLIC_BASE_URL
        value: https://nexus-paperclip-web.onrender.com
      - key: PAPERCLIP_AUTH_DISABLE_SIGN_UP
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-paperclip-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: PAPERCLIP_TOOL_ACTION_SIGNING_SECRET
        generateValue: true
      - key: PAPERCLIP_STORAGE_PROVIDER
        value: local_disk
      - key: PAPERCLIP_STORAGE_LOCAL_DIR
        value: /paperclip/instances/default/data/storage
  - type: pserv
    name: nexus-paperclip-db
    plan: basic-256mb
    databaseName: paperclip
    user: paperclip
    diskSizeGB: 1
